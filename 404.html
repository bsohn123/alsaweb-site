<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable · Alsaweb</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --gres:#AC5B49; --gres-fonce:#8C4638; --sable:#F6EFE9; --encre:#2A211C; --ligne:#E0D2C6; }
  * { box-sizing:border-box; margin:0; }
  body { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px 16px;
         background:var(--sable); color:var(--encre); font-family:Figtree, system-ui, sans-serif; line-height:1.6; }
  main { max-width:520px; }
  .code { font-family:"Bricolage Grotesque", Georgia, serif; font-weight:800; font-size:clamp(64px,18vw,120px);
          line-height:1; color:var(--gres); letter-spacing:-.03em; }
  h1 { font-family:"Bricolage Grotesque", Georgia, serif; font-weight:600; font-size:clamp(24px,5vw,32px);
       line-height:1.2; margin:18px 0 12px; }
  p { color:#5b4c43; margin-bottom:28px; }
  a.btn { display:inline-block; background:var(--gres); color:#fff; text-decoration:none; font-weight:500;
          padding:13px 22px; border-radius:999px; transition:background .2s; }
  a.btn:hover { background:var(--gres-fonce); }
  a.mail { display:inline-block; margin-left:18px; color:var(--encre); }
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>Cette page n'existe pas (ou plus).</h1>
  <p>Le lien est peut-être ancien ou mal recopié. Le plus simple est de repartir de l'accueil.</p>
  <a class="btn" href="/">Retour à l'accueil</a>
  <a class="mail" href="mailto:contact@alsaweb.fr">contact@alsaweb.fr</a>
</main>
</body>
</html>
